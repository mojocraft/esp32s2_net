# Remove the banner when start log.
CONFIG_BOOT_BANNER=n

# log configuration
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y

# displayy configuration
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y
CONFIG_ST7789V=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
# CONFIG_LV_COLOR_16_SWAP=y  # 若点亮后颜色红蓝反转，再开启
CONFIG_LV_Z_VDB_SIZE=10
# 16bpp 即可满足 RGB565 面板，静态 VDB 从 30KB 降到 15KB
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_MEM_POOL_SIZE=16384
# LVGL 字体
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_UNSCII_8=y
# LVGL 渲染在主线程上下文运行，需要更大的主栈
CONFIG_MAIN_STACK_SIZE=4096

# === WIFI Configuration (Zephyr 3.7.2 verified) ===
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y

# Networking stack
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y

# Auto-start DHCP on Wi-Fi STA connect
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y

# Buffer tuning for ESP32-S2 (single-core + PSRAM)
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10

# Debug / Shell
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# Entropy (already working ✅)
CONFIG_ENTROPY_ESP32_RNG=y

# 启用 PSRAM 支持
CONFIG_ESP_SPIRAM=y
# PSRAM 工作模式（根据你的模组选择 QUAD 或 OCT）
CONFIG_SPIRAM_MODE_QUAD=y
# PSRAM 芯片类型（根据你的模组规格选择其一）
CONFIG_SPIRAM_TYPE_ESPPSRAM16=y
# PSRAM 时钟频率
CONFIG_SPIRAM_SPEED_40M=y
# PSRAM 堆大小（单位：字节，根据需要调整）
CONFIG_ESP_SPIRAM_HEAP_SIZE=2097152
CONFIG_ESP_HEAP_MIN_EXTRAM_THRESHOLD=32768
