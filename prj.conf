# Remove the banner when start log.
CONFIG_BOOT_BANNER=n

# =============================================================================
# Log configuration
# =============================================================================
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
# 关闭 shell 日志后端，否则日志由 UART 后端和 shell 后端各打印一遍
# （shell 后端带提示符擦除/重画转义序列，minicom 里表现为整行重复）
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

# =============================================================================
# Shell
# =============================================================================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y

# =============================================================================
# Display configuration
# =============================================================================
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y
CONFIG_ST7789V=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
# CONFIG_LV_COLOR_16_SWAP=y  # 若点亮后颜色红蓝反转，再开启
CONFIG_LV_Z_VDB_SIZE=5
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_MAIN_STACK_SIZE=3072

# =============================================================================
# Wi-Fi configuration（与官方 esp32s2.conf 完全一致，最小验证配置）
# =============================================================================
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
# 断线自动重连(多扩展器环境下 AP 踢线/信号波动后自动恢复)
CONFIG_ESP32_WIFI_STA_RECONNECT=y
# 临时诊断: 打开 blob 内部调试打印, 抓重连 201 现场
# blob 调试打印: 该 Kconfig 在本版本无消费者, 实际开关是 CONFIG_LOG_DEFAULT_LEVEL
CONFIG_LOG_DEFAULT_LEVEL=3
# iram 优化必须关闭：ESP32-S2 的 IRAM/DRAM 共享同一块 320KB SRAM，
# 开启后 WiFi blob 会多占 ~12.5KB IRAM，与 LVGL 静态缓冲抢内存，
# 导致 dram0_0_seg 链接溢出（实测 overflow ~6.5KB）。
CONFIG_ESP32_WIFI_IRAM_OPT=n
CONFIG_ESP32_WIFI_RX_IRAM_OPT=n

# =============================================================================
# Networking stack（与官方 esp32s2.conf 完全一致）
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=12
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
# 防止扫描结果事件丢失
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# =============================================================================
# Memory / Heap（与官方 esp32s2.conf 一致）
# =============================================================================
CONFIG_HEAP_MEM_POOL_SIZE=61440

# =============================================================================
# Entropy（硬件随机数，Wi-Fi 需要）
# =============================================================================
CONFIG_ENTROPY_ESP32_RNG=y

# =============================================================================
# PSRAM configuration（外部 PSRAM = WROVER N4R2 模组上的 2 MB 芯片）
# =============================================================================
# 硬件事实：ESP32-S2 的 DMA（Wi-Fi MAC、GDMA 均如此）只能访问内部 SRAM
# （SOC_DMA_LOW=0x3FFB0000 ~ SOC_DMA_HIGH=0x40000000），
# PSRAM(0x3F800000) 只有 CPU 能经 cache 访问，任何 DMA 缓冲落入 PSRAM 都会失效。
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_TYPE_ESPPSRAM16=y
CONFIG_SPIRAM_SPEED_40M=y
# 从 PSRAM 中划出 1 MB 作为附加堆（spiram heap）
CONFIG_ESP_SPIRAM_HEAP_SIZE=1048576
# 分配阈值：请求 >= 32768 字节走 PSRAM，其余优先走内部堆。
# 保持 32768 的原因：
#   1) 屏幕 SPI DMA 临时缓冲最大 4092 字节（spi_esp32_spim.c），必须留在内部 RAM；
#   2) 应用想用 PSRAM 时直接 k_malloc(>=32KB) 即可。
CONFIG_ESP_HEAP_MIN_EXTRAM_THRESHOLD=32768

# ❌ 不要启用 CONFIG_SPIRAM_FETCH_INSTRUCTIONS / CONFIG_SPIRAM_RODATA：
#    开启后 esp_psram.c 会调用 mmu_config_psram_text_segment() 等函数，
#    而 Zephyr v3.7.2 的 hal 只在 esp32s3 里实现了这些函数
#    （modules/hal/espressif/zephyr/esp32s3/CMakeLists.txt 才编译
#    mmu_psram_flash.c），esp32s2 会直接链接报错 undefined reference。

# ❌ 不要启用 CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM：
#    它会把网络栈的 .noinit 静态缓冲池放到 PSRAM；ESP32-S2 上这些缓冲
#    最终被 Wi-Fi MAC 以 DMA 方式访问，PSRAM 不可 DMA，会导致扫描/连接失败。
#    （见 zephyrproject-rtos/zephyr issue #74246、#109602）

# ✅ 依赖一个对 hal_espressif 模块的小 patch（esp32s2/esp_wifi_adapter.c）：
#    1) 去掉 g_wifi_feature_caps 里的 CONFIG_FEATURE_CACHE_TX_BUF_BIT
#       （避免 32×1600B 的 cache-TX 缓冲池耗尽内部堆）；
#    2) *_internal_wrapper 改用 k_aligned_alloc()，保证 Wi-Fi 固件的
#       DMA 缓冲永远落在内部 SRAM。
#    patch 文件保存在工程 patches/ 目录，west update 后需重新应用。
